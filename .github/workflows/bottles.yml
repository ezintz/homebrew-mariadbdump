name: Build bottles

on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula name (without .rb), e.g. mariadbdump or mariadbdump@11.4"
        required: true
        default: mariadbdump
  push:
    branches: [main]
    paths:
      - "Formula/**.rb"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # arm64, actually Sonoma (14.x) — brew's real bottle tag is arm64_sonoma
            os: arm64_sonoma
          - runner: ubuntu-latest
            os: x86_64_linux
    runs-on: ${{ matrix.runner }}
    steps:
      # No checkout here: setup-homebrew detects this repo as a tap (name
      # matches `owner/homebrew-*`) and taps it itself, fetching GITHUB_SHA
      # and making it available both at $(brew --repo ezintz/mariadbdump)
      # and (symlinked) at $GITHUB_WORKSPACE. A separate checkout would just
      # get wiped out by that process, since it clears $GITHUB_WORKSPACE
      # before laying its own clone down there.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@13f73d7cbd2f8f180d85d8f7201698cf110bf84c # master (2026-08-12)
        with:
          token: ${{ github.token }}

      - name: Resolve formula name
        id: formula
        shell: bash
        env:
          FORMULA_INPUT: ${{ github.event.inputs.formula }}
        run: |
          name="$FORMULA_INPUT"
          if [ -z "$name" ]; then name="mariadbdump"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build bottle
        env:
          FORMULA_NAME: ${{ steps.formula.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          cd "$(brew --repo ezintz/mariadbdump)"
          brew install --build-bottle --verbose "ezintz/mariadbdump/$FORMULA_NAME"
          # --no-rebuild: without it, brew compares the formula against
          # origin/HEAD to auto-bump the rebuild number. setup-homebrew
          # checks out exactly origin/HEAD, so the formula always matches
          # itself and brew always bumps rebuild to 1, producing a
          # "*.bottle.1.tar.gz" filename that the glob patterns below (and
          # the merge job's `bottle --merge`) don't expect.
          brew bottle --no-rebuild --json --root-url "https://github.com/$REPO/releases/download/bottles" \
            "ezintz/mariadbdump/$FORMULA_NAME"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.bottle.tar.gz"

      - name: Upload bottle artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottle-${{ matrix.os }}
          path: |
            *.bottle.tar.gz
            *.bottle.json

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      # No checkout: setup-homebrew taps this repo itself (see the build
      # job's comment above) and needs its own `token` input to leave the
      # git credentials in place for the push step below, since it replaces
      # $GITHUB_WORKSPACE/.git with a fresh clone.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@13f73d7cbd2f8f180d85d8f7201698cf110bf84c # master (2026-08-12)
        with:
          token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bottle-*
          merge-multiple: true

      - name: Merge bottle hashes into formula
        run: brew bottle --merge --write --no-commit ./*.bottle.json

      - name: Commit updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula
          git diff --cached --quiet || git commit -m "Add bottles [ci]"

      - name: Push
        run: git push

      - name: Publish bottles to the "bottles" release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: bottles
          name: Bottles
          body: Rolling release holding built Homebrew bottles. Formulae reference assets here via bottle root_url.
          files: "*.bottle.tar.gz"

      - name: Generate subject hashes for SLSA provenance
        id: hash
        run: echo "hashes=$(sha256sum ./*.bottle.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: merge
    permissions:
      actions: read
      id-token: write
      contents: write
    # Intentionally a floating vX.Y.Z tag, not a pinned SHA: the generator
    # verifies its own tag internally and requires this exact form — a SHA
    # pin here breaks it. See https://github.com/slsa-framework/slsa-github-generator.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.merge.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: bottles
